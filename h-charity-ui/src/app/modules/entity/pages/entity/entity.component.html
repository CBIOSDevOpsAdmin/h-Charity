<div class="grid">
  <div class="col-12">
    <div class="card">
      <h5>DataView</h5>
      <p-dataView #dv [value]="entities" [paginator]="true" [rows]="9" filterBy="name" [sortField]="sortField"
        [sortOrder]="sortOrder" layout="grid">
        <ng-template pTemplate="header">
          <div class="flex flex-column md:flex-row md:justify-content-between gap-2">
            <p-dropdown [options]="viewOptions" placeholder="Select Sorting"
              (onChange)="onViewChange($event)"></p-dropdown>
            <span class="p-input-icon-left">
              <i class="pi pi-search"></i>
              <input type="search" pInputText placeholder="Search by Name" (input)="onFilter(dv, $event)" />
            </span>
          </div>
        </ng-template>

        <ng-template let-entities pTemplate="gridItem">
          <div class="grid grid-nogutter">
            <div class="col-12 md:col-4" *ngFor="let entity of entities">
              <div class="card m-3 border-1 surface-border">
                <div class="flex flex-wrap gap-2 align-items-center justify-content-between mb-2">
                  <div class="flex align-items-center">
                    <i class="pi pi-warehouse mr-2"></i>
                    <span class="font-semibold">{{ entity.type }}</span>
                  </div>
                  <span [ngClass]="
                      entity.isVerified
                        ? 'status-verified status-badge'
                        : 'status-unverified status-badge'
                    ">{{ entity.isVerified ? 'Verified' : 'Unverified' }}</span>
                </div>
                <div class="flex flex-column align-items-center text-center mb-3">
                  <img width="300" height="200" [src]="entity.entityPhotos.coverPhoto" [alt]="entity.name"
                    class="w-9 shadow-2 my-3 mx-0" />
                  <div class="text-2xl font-bold">{{ entity.name }}</div>
                  <div class="mb-3">{{ address }}</div>
                </div>
                <div class="flex align-items-center justify-content-between">
                  <p-button icon="pi pi-trash" (click)="deleteEntity($event, entity.id)" severity="danger"
                    *ngIf="showDeleteButton(entity)"></p-button>
                  <p-button icon="pi pi-eye" (click)="viewEntity(entity.id)"></p-button>
                  <p-button icon="pi pi-pencil" (click)="goToEntity(entity.id)"
                    *ngIf="showEditButton(entity)"></p-button>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </p-dataView>
    </div>
  </div>
</div>
<p-toast />
<p-confirmDialog />
